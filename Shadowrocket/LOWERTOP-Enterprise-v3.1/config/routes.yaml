inline_rules:
- rule: DOMAIN,captive.apple.com,DIRECT
  stage: 0
  comment: 公共 Wi-Fi 门户认证例外
- rule: DOMAIN-SUFFIX,litix.io,MAX
  stage: 65
- rule: DOMAIN-SUFFIX,discomax.com,MAX
  stage: 65
- rule: DOMAIN-SUFFIX,brightline.tv,MAX
  stage: 65
remote_rulesets:
- name: Telegram
  path: rule/Shadowrocket/Telegram/Telegram.list
  policy: Telegram
  stage: 50
  audit:
    min_rules: 10
    max_rules: 5000
    max_bytes: 5000000
    require_commit_pin: true
- name: YouTube
