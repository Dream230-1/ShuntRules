- name: Common-Tracking-Reject
  file: rules/tracking/Common-Tracking-Reject.list
  policy: REJECT
  stage: 18
- name: Apple-Telemetry-Reject
  file: rules/apple/Apple-Telemetry-Reject.list
  policy: REJECT
  stage: 19
- name: AI-Core
  file: rules/ai/AI-Core.list
  policy: AI
  stage: 20
- name: AI-Realtime
  file: rules/ai/AI-Realtime.list
