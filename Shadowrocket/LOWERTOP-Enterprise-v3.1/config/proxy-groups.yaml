- name: 香港节点
  type: url-test
  members: []
  params:
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5
    select: 0
    policy-regex-filter: 🇭🇰|HK|Hong|hong|香港|深港|沪港|京港|港
- name: 台湾节点
  type: url-test
  members: []
  params:
    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5
    select: 0
    policy-regex-filter: 🇹🇼|TW|TWN|Taiwan|Taipei|taiwan|台湾|台灣|台北|台中|新北|彰化
- name: 日本节点
  type: url-test
