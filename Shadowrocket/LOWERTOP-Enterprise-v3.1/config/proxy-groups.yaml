    url: http://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 5
    select: 0
    policy-regex-filter: 🇯🇵|JP|Japan|japan|Tokyo|tokyo|日本|东京|大阪|京日|苏日|沪日|上日|川日|深日|广日
- name: 新加坡节点
